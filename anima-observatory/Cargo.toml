[package]
name        = "anima-observatory"
description = "Anima Observatory — real-time human telemetry window for TPT Anima"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[[bin]]
name = "anima-observatory"
path = "src/main.rs"

[dependencies]
serde.workspace      = true
serde_json.workspace = true
tokio.workspace      = true
thiserror.workspace  = true
uuid.workspace       = true
axum                 = { version = "0.7", features = ["ws"] }
anima-sse            = { path = "../anima-sse" }
anima-inp            = { path = "../anima-inp" }
anima-ck             = { path = "../anima-ck" }
anima-zkpa           = { path = "../anima-zkpa" }
