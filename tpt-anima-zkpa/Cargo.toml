[package]
keywords   = ["zero-knowledge", "zk-snarks", "authentication", "attestation", "proof-of-agency"]
categories = ["cryptography", "authentication", "science"]
name        = "tpt-anima-zkpa"
description = "Zero-Knowledge Proof of Agency — the immune system of TPT Anima"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[dependencies]
serde.workspace      = true
serde_json.workspace = true
uuid.workspace       = true
sha2.workspace       = true
thiserror.workspace  = true
tokio.workspace      = true
ark-ff        = "0.5"
ark-bn254     = "0.5"
ark-relations = "0.5"
ark-r1cs-std  = "0.6"
ark-groth16   = "0.5"
ark-snark     = "0.5"
ark-serialize = "0.5"
ark-std       = "0.5"
rand          = "0.8"
raw-cpuid     = "11"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
nvml-wrapper = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
