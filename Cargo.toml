[workspace]
resolver = "2"
members = [
    "anima-sse",
    "anima-inp",
    "anima-ck",
    "anima-zkpa",
    "anima-observatory",
    "anima-edge-gateway",
    "anima-edge-runtime",
    "anima-tests",
    "anima-core-hypervisor",
    "anima-co-processor",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "Apache-2.0"
authors      = ["TPT Solutions <open-source@tptsolutions.io>"]
repository   = "https://github.com/PhillipC05/tpt-anima"
rust-version = "1.80"

[workspace.dependencies]
serde      = { version = "1",    features = ["derive"] }
serde_json = "1"
uuid       = { version = "1",    features = ["v4", "serde"] }
sha2       = "0.10"
tokio      = { version = "1",    features = ["full"] }
thiserror  = "1"
